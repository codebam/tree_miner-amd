[workspace]
resolver = "2"
members = [
    "crates/tm-core",
    "crates/tm-argon2",
    "crates/tm-gpu",
    "crates/tm-journal",
    "crates/tm-submit",
    "crates/tm-dashboard",
    "crates/tm-tui",
    "crates/treeminer",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tm-core = { path = "crates/tm-core" }
tm-argon2 = { path = "crates/tm-argon2" }
tm-gpu = { path = "crates/tm-gpu" }
tm-journal = { path = "crates/tm-journal" }
tm-submit = { path = "crates/tm-submit" }
tm-dashboard = { path = "crates/tm-dashboard" }
tm-tui = { path = "crates/tm-tui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
blake2 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
rand = "0.8"
libc = "0.2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
