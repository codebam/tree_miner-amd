[package]
name = "treeminer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "treeminer"
path = "src/lib.rs"

[[bin]]
name = "treeminer"
path = "src/main.rs"

[features]
default = ["amd"]
# Forwarded straight to tm-gpu, which is where they mean something. `amd` is the tested
# vendor; `nvidia` is compile-verified and has never been executed — see PORT.md.
amd = ["tm-gpu/amd"]
nvidia = ["tm-gpu/nvidia"]

[dependencies]
tm-core = { workspace = true }
tm-argon2 = { workspace = true }
tm-gpu = { workspace = true, default-features = false }
tm-journal = { workspace = true }
tm-submit = { workspace = true }
tm-dashboard = { workspace = true }
tm-platform = { workspace = true }
tm-tui = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
